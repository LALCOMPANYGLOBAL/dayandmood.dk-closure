
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Day & Mood | A New Chapter</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #ffffff;
      color: #171717;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 50px 24px;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      text-align: center;
    }

    .logo {
      display: block;
      width: 155px;
      max-width: 65%;
      height: auto;
      margin: 0 auto 32px;
    }

    .thank-you {
      font-size: 16px;
      line-height: 1.8;
      letter-spacing: 1.5px;
      margin: 0 auto 55px;
      font-weight: 500;
    }

    .divider {
      width: 75px;
      height: 1px;
      background: #777777;
      border: 0;
      margin: 0 auto 55px;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(34px, 5.2vw, 66px);
      font-weight: normal;
      line-height: 1.15;
      margin: 0 0 14px;
      letter-spacing: -1.5px;
    }

    .tagline {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(23px, 3.5vw, 42px);
      font-style: italic;
      line-height: 1.3;
      margin: 0 0 65px;
    }

    .second-divider {
      width: 75px;
      height: 1px;
      background: #777777;
      border: 0;
      margin: 0 auto 55px;
    }

    .continuation {
      font-size: 18px;
      letter-spacing: 2px;
      margin: 0 0 55px;
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      width: min(100%, 570px);
      padding: 23px 25px;
      background: #222222;
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 3px;
      transition: background 0.3s ease;
    }

    .button:hover {
      background: #444444;
    }

    .countdown {
      margin-top: 48px;
      font-size: 14px;
      letter-spacing: 5px;
      font-weight: 500;
    }

    .countdown strong {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 30px;
      letter-spacing: 1px;
      margin: 0 5px;
    }

    @media (max-width: 600px) {
      body {
        padding: 45px 22px;
      }

      .logo {
        width: 135px;
        margin-bottom: 28px;
      }

      .thank-you {
        font-size: 13px;
        letter-spacing: 0.8px;
        margin-bottom: 42px;
      }

      .divider {
        margin-bottom: 42px;
      }

      h1 {
        font-size: 36px;
        letter-spacing: -0.8px;
      }

      .tagline {
        font-size: 25px;
        margin-bottom: 45px;
      }

      .second-divider {
        margin-bottom: 40px;
      }

      .continuation {
        font-size: 15px;
        letter-spacing: 1px;
        margin-bottom: 40px;
      }

      .button {
        padding: 20px 12px;
        font-size: 12px;
        letter-spacing: 2px;
      }

      .countdown {
        margin-top: 35px;
        font-size: 11px;
        letter-spacing: 3px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <img
      class="logo"
      src="day-mood-logo.png"
      alt="DAY & MOOD"
    >

    <p class="thank-you">
      Thank you for being part of the Day &amp; Mood journey at dayandmood.dk.
    </p>

    <hr class="divider">

    <h1>OUR WEBSHOP IS NOW CLOSED.</h1>

    <p class="tagline">
      Every journey leaves a little something behind.
    </p>

    <hr class="second-divider">

    <p class="continuation">
      The collection continues at Still Nordic.
    </p>

    <a
      class="button"
      href="https://stillnordic.com/"
    >
      DISCOVER STILL NORDIC &nbsp; →
    </a>

    <p class="countdown">
      REDIRECTING IN <strong id="timer">15</strong> SECONDS.
    </p>

  </main>

  <script>
    let seconds = 15;
    const timer = document.getElementById("timer");
    const destination = "https://stillnordic.com/";

    const countdown = setInterval(function () {
      seconds--;
      timer.textContent = seconds;

      if (seconds <= 0) {
        clearInterval(countdown);
        window.location.href = destination;
      }
    }, 1000);
  </script>
</body>
</html>
