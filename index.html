
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day & Mood | A New Chapter</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #ffffff;
      color: #171717;
      font-family: "Helvetica Neue", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 45px 22px;
    }

    .page {
      width: 100%;
      max-width: 1050px;
      text-align: center;
      padding: 30px 20px;
    }

    .logo {
      display: block;
      width: min(360px, 75%);
      max-height: 125px;
      object-fit: contain;
      margin: 0 auto 65px;
    }

    .headline {
      font-family: "Bodoni MT", "Didot", "Times New Roman", serif;
      font-size: clamp(38px, 6vw, 66px);
      font-weight: 400;
      font-style: italic;
      line-height: 1.18;
      margin: 0 auto 38px;
      max-width: 850px;
    }

    .divider {
      width: 65px;
      height: 1px;
      background: #222222;
      margin: 0 auto 35px;
    }

    .message {
      font-size: 17px;
      line-height: 2;
      letter-spacing: 2px;
      max-width: 780px;
      margin: 0 auto;
    }

    .message p {
      margin: 0 0 22px;
    }

    .button {
      display: inline-block;
      margin-top: 24px;
      padding: 22px 48px;
      background: #222222;
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      letter-spacing: 4px;
      transition: background 0.3s ease;
    }

    .button:hover {
      background: #555555;
    }

    .redirect {
      margin-top: 38px;
      font-size: 14px;
      letter-spacing: 4px;
    }

    #countdown {
      font-size: 22px;
      font-weight: 600;
      margin: 0 5px;
    }

    @media (max-width: 600px) {
      body {
        padding: 25px 16px;
      }

      .page {
        padding: 20px 5px;
      }

      .logo {
        margin-bottom: 48px;
      }

      .headline {
        font-size: 39px;
      }

      .message {
        font-size: 14px;
        letter-spacing: 1.2px;
      }

      .button {
        padding: 18px 24px;
        font-size: 12px;
        letter-spacing: 2px;
      }

      .redirect {
        font-size: 11px;
        letter-spacing: 2px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <img
      class="logo"
      src="day-mood-logo.png"
      alt="DAY & MOOD"
    >

    <h1 class="headline">
      Every journey leaves<br>
      a little something behind.
    </h1>

    <div class="divider"></div>

    <section class="message">

      <p>
        Thank you for being part of the Day &amp; Mood journey
        at dayandmood.dk.
      </p>

      <p>
        Our webshop is now closed, but the journey continues.
      </p>

      <p>
        Discover the collection at Still Nordic.
      </p>

    </section>

    <a
      class="button"
      href="https://stillnordic.com/"
      id="continueButton"
    >
      CONTINUE TO STILL NORDIC &nbsp; →
    </a>

    <div class="redirect">
      YOU'LL BE REDIRECTED IN
      <span id="countdown">15</span>
      SECONDS.
    </div>

  </main>

  <script>
    let seconds = 15;

    const countdown = document.getElementById("countdown");
    const destination = "https://stillnordic.com/";

    const timer = setInterval(function () {
      seconds--;

      countdown.textContent = seconds;

      if (seconds <= 0) {
        clearInterval(timer);
        window.location.replace(destination);
      }
    }, 1000);

    document.getElementById("continueButton").addEventListener("click", function () {
      clearInterval(timer);
    });
  </script>

</body>
</html>
