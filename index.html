
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day & Mood – Webshop Closed</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f5f1;
      color: #333;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }

    .container {
      max-width: 600px;
      width: 100%;
      background: #ffffff;
      padding: 55px 35px;
    }

    h1 {
      font-size: 30px;
      font-weight: 400;
      letter-spacing: 2px;
      margin-bottom: 25px;
    }

    p {
      font-size: 16px;
      line-height: 1.8;
      color: #666;
    }

    .timer {
      margin: 30px 0;
      font-size: 16px;
      color: #555;
    }

    #countdown {
      font-size: 24px;
      font-weight: bold;
      color: #333;
    }

    .button {
      display: inline-block;
      padding: 15px 30px;
      background: #333;
      color: white;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 1px;
      margin-top: 15px;
    }

    .button:hover {
      background: #555;
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>DAY & MOOD</h1>

    <p>
      Thank you for being part of our journey.
    </p>

    <p>
      Our Day & Mood webshop is now closed.
      You can continue shopping with us at Still Nordic.
    </p>

    <div class="timer">
      Redirecting in <strong id="countdown">15</strong> seconds
    </div>

    <a class="button" href="https://stillnordic.com/">
      CONTINUE TO STILL NORDIC
    </a>

  </main>

  <script>
    let seconds = 15;

    const countdown = document.getElementById("countdown");
    const destination = "https://stillnordic.com/";

    countdown.textContent = seconds;

    const timer = setInterval(function () {
      seconds--;

      countdown.textContent = seconds;

      if (seconds <= 0) {
        clearInterval(timer);
        window.location.href = destination;
      }
    }, 1000);
  </script>

</body>
</html>
