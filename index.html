
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Day &amp; Mood | A New Chapter</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #ffffff;
      color: #222222;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 55px 25px;
    }

    .container {
      width: 100%;
      max-width: 1150px;
      text-align: center;
    }

    .logo {
      display: block;
      width: 244px;
      max-width: 70%;
      height: auto;
      margin: 0 auto 48px;
    }

    .thank-you {
      font-size: 22.5px;
      line-height: 1.8;
      letter-spacing: 1.5px;
      font-weight: 400;
      margin: 0 auto 69px;
    }

    .divider {
      width: 94px;
      height: 1px;
      background: #888888;
      border: 0;
      margin: 0 auto 69px;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(28.8px, 4.14vw, 52.2px);
      font-weight: 400;
      line-height: 1.2;
      margin: 0 0 16px;
      letter-spacing: -0.9px;
    }

    .tagline {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(22.5px, 3.15vw, 39.6px);
      font-weight: 400;
      font-style: italic;
      line-height: 1.35;
      margin: 0 0 69px;
    }

    .second-divider {
      width: 94px;
      height: 1px;
      background: #888888;
      border: 0;
      margin: 0 auto 60px;
    }

    .continuation {
      font-size: 25px;
      font-weight: 400;
      letter-spacing: 1.9px;
      line-height: 1.7;
      margin: 0 0 60px;
    }

    .button {
      display: inline-block;
      width: min(100%, 713px);
      padding: 29px 25px;
      background: #222222;
      color: #ffffff;
      text-decoration: none;
      font-size: 17.5px;
      font-weight: 600;
      letter-spacing: 3.75px;
      transition: background 0.3s ease;
    }

    .button:hover {
      background: #444444;
    }

    .countdown {
      margin: 53px 0 0;
      font-size: 18.75px;
      letter-spacing: 5px;
      font-weight: 400;
    }

    .countdown strong {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 35px;
      font-weight: 600;
      letter-spacing: 1px;
      margin: 0 6px;
    }

    @media (max-width: 600px) {
      body {
        padding: 45px 22px;
      }

      .logo {
        width: 206px;
        margin-bottom: 38px;
      }

      .thank-you {
        font-size: 18.75px;
        letter-spacing: 1px;
        margin-bottom: 50px;
      }

      .divider {
        margin-bottom: 52px;
      }

      h1 {
        font-size: 31.5px;
        letter-spacing: -0.54px;
      }

      .tagline {
        font-size: 22.5px;
        margin-bottom: 52px;
      }

      .second-divider {
        margin-bottom: 48px;
      }

      .continuation {
        font-size: 20px;
        letter-spacing: 1.25px;
        margin-bottom: 48px;
      }

      .button {
        padding: 25px 12px;
        font-size: 15px;
        letter-spacing: 2.5px;
      }

      .countdown {
        margin-top: 40px;
        font-size: 13.75px;
        letter-spacing: 3.75px;
      }

      .countdown strong {
        font-size: 31.25px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <img
      class="logo"
      src="day-mood-logo.png"
      alt="DAY &amp; MOOD"
    >

    <p class="thank-you">
      Thank you for being part of the Day &amp; Mood journey at dayandmood.dk.
    </p>

    <hr class="divider">

    <h1>OUR WEBSHOP IS NOW CLOSED.</h1>

    <p class="tagline">
      Every journey leaves a little something behind.
    </p>

    <hr class="second-divider">

    <p class="continuation">
      The collection continues at Still Nordic.
    </p>

    <a class="button" href="https://stillnordic.com/">
      DISCOVER STILL NORDIC &nbsp; →
    </a>

    <p class="countdown">
      REDIRECTING IN <strong id="timer">10</strong> SECONDS.
    </p>

  </main>

  <script>
    let seconds = 10;
    const timer = document.getElementById("timer");
    const destination = "https://stillnordic.com/";

    const countdown = setInterval(function () {
      seconds--;
      timer.textContent = seconds;

      if (seconds <= 0) {
        clearInterval(countdown);
        window.location.href = destination;
      }
    }, 1000);
  </script>
</body>
</html>
