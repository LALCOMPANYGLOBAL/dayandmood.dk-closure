
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day & Mood – Webshop Closed</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f3ee;
      color: #282820;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }

    .container {
      max-width: 520px;
      width: 100%;
      padding: 55px 30px;
    }

    .brand {
      font-family: Georgia, serif;
      font-size: 36px;
      letter-spacing: 5px;
      margin-bottom: 55px;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: 30px;
      font-weight: normal;
      margin-bottom: 20px;
    }

    p {
      color: #68685f;
      line-height: 1.8;
      font-size: 15px;
    }

    .timer {
      margin: 30px 0;
      font-size: 14px;
      letter-spacing: 1px;
    }

    .button {
      display: inline-block;
      background: #292a23;
      color: white;
      padding: 16px 32px;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 1.5px;
    }

    .button:hover { background: #55564c; }
  </style>
</head>
<body>
  <main class="container">
    <div class="brand">DAY & MOOD</div>

    <h1>Our webshop is now closed.</h1>

    <p>
      Thank you for being part of our journey.
      You can continue shopping with us at Still Nordic.
    </p>

    <div class="timer">
      Redirecting in <strong id="countdown">5</strong> seconds
    </div>

    <a class="button"
       href="https://stillnordic.com/"
       id="continueButton">
       CONTINUE TO STILL NORDIC
    </a>
  </main>

  <script>
    let seconds = 15;
    const countdown = document.getElementById("countdown");
    const destination = "https://stillnordic.com/";

    const timer = setInterval(() => {
      seconds--;
      countdown.textContent = seconds;

      if (seconds <= 0) {
        clearInterval(timer);
        window.location.replace(destination);
      }
    }, 1000);
  </script>
</body>
</html>
